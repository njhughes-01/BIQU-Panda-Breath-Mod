# Dedicated Panda device broker (openspec native-panda-mqtt).
# Authenticated only: the Panda firmware and the mod's device client each
# present a username + password from the password_file below. The HA broker
# is a SEPARATE broker — this one never talks to Home Assistant.
#
# The password file is a bind mount from a directory OUTSIDE this repository
# (see docker-compose.panda-native.yml). It is generated with mosquitto_passwd
# (hashed), never committed, and never contains a default password.

persistence true
persistence_location /mosquitto/data/

listener 1883
allow_anonymous false
password_file /run/secrets/panda_device_mqtt_passwords

# Keep the log useful but narrow: no per-subscription/wildcard chatter, no
# payload logging. Credentials never appear in these lines.
log_dest stdout
log_type error
log_type warning
log_type notice
