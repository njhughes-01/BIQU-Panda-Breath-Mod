# CC2 full stack — Panda backend + web UI + Elegoo Centauri Carbon 2 backend.
# Use this file on its own when running the CC2 variant (Portainer, single-file curl, etc.)
#
# Usage:
#   docker compose -f docker-compose.cc2.yml up -d
#
# Or in Portainer: use this file's URL directly as the compose file.
#
# Requirements:
#   - CC2_IP and CC2_SN must be set in .env or as stack environment variables.
#   - LAN-only mode must be enabled on the CC2 printer:
#       Settings -> Network -> LAN Only Mode -> Enable

services:
  panda_backend:
    container_name: panda_backend
    # To pin to a specific release: image: ghcr.io/njhughes-01/biqu-panda-breath-mod:2.0.0
    image: ghcr.io/njhughes-01/biqu-panda-breath-mod:latest
    command: python3 Panda.py
    restart: unless-stopped
    ports:
      - "8883:8883"
    environment:
      HA_MQTT_BROKER: ${HA_MQTT_BROKER:-mosquitto}
      HA_MQTT_PORT: ${HA_MQTT_PORT:-1883}
      HA_MQTT_USER: ${HA_MQTT_USER:-}
      HA_MQTT_PASS: ${HA_MQTT_PASS:-}
      HA_BASE_URL: ${HA_BASE_URL:-http://homeassistant:8123}
      HA_TOKEN: ${HA_TOKEN:-}
      PANDA_IP: ${PANDA_IP:-}
      PANDA_SN: ${PANDA_SN:-}
      PANDA_ACCESS_CODE: ${PANDA_ACCESS_CODE:-}
      PANDA_HOST_IP: ${PANDA_HOST_IP:-}
      PANDA_MQTT_TOPIC_PREFIX: ${PANDA_MQTT_TOPIC_PREFIX:-panda_breath_mod}
      CC2_IP: ${CC2_IP:-}
      CC2_TOPIC_PREFIX: ${CC2_TOPIC_PREFIX:-cc2}
    volumes:
      - panda_certs:/app/certs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  panda_web:
    container_name: panda_web
    # To pin to a specific release: image: ghcr.io/njhughes-01/biqu-panda-breath-mod:2.0.0
    image: ghcr.io/njhughes-01/biqu-panda-breath-mod:latest
    command: python3 panda_web.py
    restart: unless-stopped
    ports:
      - "${PANDA_WEB_PORT:-8088}:8080"
    environment:
      HA_MQTT_BROKER: ${HA_MQTT_BROKER:-mosquitto}
      HA_MQTT_PORT: ${HA_MQTT_PORT:-1883}
      HA_MQTT_USER: ${HA_MQTT_USER:-}
      HA_MQTT_PASS: ${HA_MQTT_PASS:-}
      PANDA_MQTT_TOPIC_PREFIX: ${PANDA_MQTT_TOPIC_PREFIX:-panda_breath_mod}
      PANDA_WEB_INTERNAL_PORT: 8080
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cc2_backend:
    container_name: cc2_backend
    # To pin to a specific release: image: ghcr.io/njhughes-01/biqu-panda-breath-mod:2.0.0
    image: ghcr.io/njhughes-01/biqu-panda-breath-mod:latest
    command: python3 cc2_connector.py
    restart: unless-stopped
    environment:
      CC2_IP: ${CC2_IP:-}
      CC2_USER: ${CC2_USER:-elegoo}
      CC2_PASS: ${CC2_PASS:-123456}
      CC2_SN: ${CC2_SN:-}
      CC2_TOPIC_PREFIX: ${CC2_TOPIC_PREFIX:-cc2}
      HA_MQTT_BROKER: ${HA_MQTT_BROKER:-mosquitto}
      HA_MQTT_PORT: ${HA_MQTT_PORT:-1883}
      HA_MQTT_USER: ${HA_MQTT_USER:-}
      HA_MQTT_PASS: ${HA_MQTT_PASS:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import os; os.kill(1, 0)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  panda_certs:
