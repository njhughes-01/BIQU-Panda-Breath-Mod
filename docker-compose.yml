services:
  panda_backend:
    build: .
    command: python3 Panda.py
    restart: unless-stopped
    volumes:
      - ./panda_config.json:/app/panda_config.json:ro
      - ./certs/cert.pem:/app/cert.pem:ro
      - ./certs/key.pem:/app/key.pem:ro
    ports:
      - "8883:8883"
    env_file:
      - .env
    profiles:
      - panda

  cc2_backend:
    build: .
    command: python3 cc2_connector.py
    restart: unless-stopped
    env_file:
      - .env
    profiles:
      - cc2
