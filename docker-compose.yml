services:
  panda_backend:
    build:
      context: .
      platforms:
        - linux/amd64
        - linux/arm64
    command: python3 Panda.py
    restart: unless-stopped
    volumes:
      - ./panda_config.json:/app/panda_config.json:ro
      - ./certs/cert.pem:/app/cert.pem:ro
      - ./certs/key.pem:/app/key.pem:ro
    ports:
      - "8883:8883"
    env_file:
      - .env
    profiles:
      - panda
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cc2_backend:
    build:
      context: .
      platforms:
        - linux/amd64
        - linux/arm64
    command: python3 cc2_connector.py
    restart: unless-stopped
    env_file:
      - .env
    profiles:
      - cc2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import os; os.kill(1, 0)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
