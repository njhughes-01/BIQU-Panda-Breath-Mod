services:
  panda_backend:
    build:
      context: .
      platforms:
        - linux/amd64
        - linux/arm64
    command: python3 Panda.py
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - panda_certs:/app/certs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cc2_backend:
    build:
      context: .
      platforms:
        - linux/amd64
        - linux/arm64
    command: python3 cc2_connector.py
    restart: unless-stopped
    env_file:
      - .env
    profiles:
      - cc2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import os; os.kill(1, 0)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  panda_certs:
